# SimpleNet (Liu et al., CVPR'23) on the small faces test set.
#
# Reuses the cluster checkpoint trained on the faces train/good split.
# Identical hyperparameters to the cable config — only paths differ.

data:
  image_dir: /data/akheirandish3/mvtec_ad/faces/test/random
  sample_name: samples_40         # placeholder; --sample_names overrides
  gt_mask:
    path: /data/akheirandish3/mvtec_ad/faces/ground_truth/random/{sample}_mask.png
    downsample_factor: 1

scoring:
  algorithm: baseline

baseline:
  name: simplenet
  params:
    ckpt: /data/akheirandish3/SimpleNet/results/MVTecAD_Results_faces/simplenet_mvtec_faces/run/models/0/mvtec_faces/ckpt.pth
    device: cuda:0
    simplenet_repo: /home/rohan/ood/baseline-algos-clone/SimpleNet
    backbone: wideresnet50
    layers_to_extract_from: [layer2, layer3]
    imagesize: 288
    pretrain_embed_dim: 1536
    target_embed_dim: 1536
    patchsize: 3
    embedding_size: 256
    dsc_layers: 2
    dsc_hidden: 1024
    dsc_margin: 0.5
    pre_proj: 1
    # Cluster's faces ckpt was trained with reversed discriminator polarity —
    # default sign gives Px AUC 0.28 (sub-random); inverted gives 0.86.
    # Verified empirically on samples_40. Cable ckpt uses default polarity.
    invert_score: true

eval:
  delta_smooth_sigmas: [null, 5.0]
  output_dir: ./results_eval/baseline_simplenet_faces
