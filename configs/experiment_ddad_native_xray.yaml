# Eval config: DDAD-native recons on X-ray, typical_set / local_gaussian scorers.
# Produced by tools/run_ddad_reconstruction.py with the X-ray UNet checkpoint.

sampling:
  enabled: false
  num_patches: 1
  # Sampling sub-blocks below are unused when enabled=false; kept for schema completeness.
  model: {config: configs/model_config.yaml, checkpoint: null}
  diffusion: {sampler: ddpm, steps: 1000, noise_schedule: linear, model_mean_type: epsilon, model_var_type: learned_range, timestep_respacing: "1000"}
  conditioning: {method: ps, scale: 0.5}
  measurement:
    operator: inpainting
    noise: {type: gaussian, sigma: 0.1}
    mask: {type: refined_box, image_size: 256, mask_len_range: [128, 129], mask_prob: 0.9}
  patch_size: 64
  gpu_ids: [0]
  seed: 0

data:
  image_dir: /data/akheirandish3/mvtec_ad/CT/test/random
  figures_dir: ./figures_CT
  results_dir: ./results_patches_CT_native
  sample_name: image_0000          # placeholder; overridden via --sample_names
  test_origin: ddad_native
  bottom_suffix: "4"
  gt_mask:
    path: /data2/akheirandish3/id_new_warped_images/masks_ood_default_large/{sample}_mask.png
    downsample_factor: 1               # masks already at 256x256 from prepare_xray_dataset.py

embeddings:
  backbone: resnet18
  layers: [layer1, layer2, layer3]
  use_patch_context: true
  patchify_size: 3
  proj_dim_per_layer: null
  device: cuda

pca: {n_components: 5}

superpixels:
  var_threshold: 0.0
  min_pixels: 20
  max_sub: 6
  max_depth: 4
  compactness: 12.0
  alpha_grad: 10.0
  target_size: 100

scoring:
  bins_rgb: 32
  bins_pca: 16
  smooth_sigma: 0.1
  min_pixels: 2
  use_label_as_target: true
  eps: 1.0e-12
  n_realizations: 1000
  lg_metric: typicality_unsigned

eval:
  delta_smooth_sigmas: [null, 5.0]
  sp_anomaly_threshold: 0.5
  save_plots: false
  output_dir: ./results_eval_CT_native

baselines:
  enabled: false
  simplenet: {enabled: false, repo_dir: ".", results_dir: ".", category: CT}
  ddad: {enabled: false, repo_dir: ".", config: ".", category: CT, checkpoint_epoch: 500}
