# Eval DDAD-UNet + additive-noise DPS reconstructions (y = x + 0.1*eps, identity
# forward model, scale=0.5). Produced by tools/run_ddad_dps_sampling.py.
# Corrected R6: no inpainting mask, pure additive noise.

sampling:
  enabled: false
  num_patches: 1
  model: {config: configs/model_config.yaml, checkpoint: null}
  diffusion:
    sampler: ddpm
    steps: 1000
    noise_schedule: linear
    model_mean_type: epsilon
    model_var_type: learned_range
    timestep_respacing: "1000"
  conditioning: {method: ps, scale: 0.5}
  measurement:
    operator: inpainting
    noise: {type: gaussian, sigma: 0.1}
    mask:
      type: refined_box
      image_size: 256
      mask_len_range: [128, 129]
      mask_prob: 0.9
  patch_size: 64
  gpu_ids: [0]
  seed: 0

data:
  image_dir: /data/akheirandish3/mvtec_ad/cable/test/combined
  figures_dir: ./figures
  results_dir: ./results_patches_ddad
  sample_name: samples_000
  test_origin: ddad_dps_whole
  # Note: results_dir matches tools/run_ddad_dps_sampling.py --out_root default
  bottom_suffix: "4"
  gt_mask:
    path: /data/akheirandish3/mvtec_ad/cable/ground_truth/combined/{sample}_mask.png
    downsample_factor: 4

embeddings:
  backbone: resnet18
  layers: [layer1, layer2, layer3]
  use_patch_context: true
  patchify_size: 3
  proj_dim_per_layer: null
  device: cuda

pca:
  n_components: 5

superpixels:
  var_threshold: 0.0
  min_pixels: 20
  max_sub: 6
  max_depth: 4
  compactness: 12.0
  alpha_grad: 10.0
  target_size: 10

scoring:
  bins_rgb: 32
  bins_pca: 16
  smooth_sigma: 0.1
  min_pixels: 2
  use_label_as_target: true
  eps: 1.0e-12
  n_realizations: 1000
  lg_metric: typicality_unsigned
  sigma_rohan: 0.1

eval:
  delta_smooth_sigmas: [null, 5.0]
  sp_anomaly_threshold: 0.5
  save_plots: false
  output_dir: ./results_eval_ddad_dps  # overridden per-run via --output_dir

baselines:
  enabled: false
  simplenet: {enabled: false, repo_dir: /data/akheirandish3/SimpleNet, results_dir: /data/akheirandish3/SimpleNet/results/MVTecAD_Results, category: cable}
  ddad: {enabled: false, repo_dir: /data/akheirandish3/PaDIS_results/DDAD, config: /data/akheirandish3/PaDIS_results/DDAD/config.yaml, category: cable, checkpoint_epoch: 2000}
